name: Publish agent to catalog

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to process (e.g., v3.5.4)'
        required: true
        type: string
  release:
    types:
      - released

permissions:
  contents: read

jobs:
  oci-publish:
    uses: newrelic/coreint-automation/.github/workflows/reusable_agent_control_release.yaml@v3
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      agent_type: NRIHaproxy
      display_name: "HAProxy"
      monitoring_type: "INFRA"
      oci_registry: "docker.io/newrelic/nri-haproxy-artifacts"
      # TEMPORARY (fork bootstrap): this fork has no releases of its own. Remove before the upstream PR.
      source_repo: "newrelic/nri-haproxy"
      # TEMPORARY (fork bootstrap): the fork has no v3.5.4 tag to check out, so use a ref that exists in it.
      metadata_git_ref: "master"
      artifacts: |
        [
          {"name":"linux-amd64","os":"linux","arch":"amd64","format":"tar+gzip","source_asset":"nri-haproxy_linux_{version}_amd64.tar.gz","source_format":"tar.gz","keep_files":["var/db/newrelic-infra/newrelic-integrations/bin/nri-haproxy"]},
          {"name":"linux-arm64","os":"linux","arch":"arm64","format":"tar+gzip","source_asset":"nri-haproxy_linux_{version}_arm64.tar.gz","source_format":"tar.gz","keep_files":["var/db/newrelic-infra/newrelic-integrations/bin/nri-haproxy"]},
          {"name":"windows-amd64","os":"windows","arch":"amd64","format":"zip","source_asset":"nri-haproxy-amd64.{version}.zip","source_format":"zip","keep_files":["New Relic/newrelic-infra/newrelic-integrations/bin/nri-haproxy.exe"]}
        ]
    secrets:
      OHAI_NEWRELIC_CLIENT_ID: ${{ secrets.OHAI_NEWRELIC_CLIENT_ID }}
      OHAI_NEWRELIC_PRIVATE_KEY: ${{ secrets.OHAI_NEWRELIC_PRIVATE_KEY }}
      OHAI_OCI_USERNAME: ${{ secrets.OHAI_OCI_USERNAME }}
      OHAI_OCI_PASSWORD: ${{ secrets.OHAI_OCI_PASSWORD }}
      AGENT_METADATA_ACTION_LICENSE_KEY: ${{ secrets.AGENT_METADATA_ACTION_LICENSE_KEY }}
